# Stage 5 sidecar. Do not replace the live hugme2.com server block until review.
# Reload-only: copy location blocks into the existing server, then `nginx -s reload`.
# Rollback: point these locations back to 127.0.0.1:8000 and reload.
#
# Ordinary API → api-next (127.0.0.1:8002)
# Telegram control + video → current API (127.0.0.1:8000)
# Host :8001 is already used by /root/tiktok-monitor; do not bind api-next there.

upstream eris_api_legacy {
    server 127.0.0.1:8000;
}

upstream eris_api_next {
    server 127.0.0.1:8002;
}

# Keep Telegram session owner on the legacy process.
location ^~ /api/v1/telegram/ { proxy_pass http://eris_api_legacy; }
location ^~ /api/v1/mtproto { proxy_pass http://eris_api_legacy; }
location ^~ /api/v1/call-broadcast/ { proxy_pass http://eris_api_legacy; }
location ^~ /api/v1/video-reinvite/ { proxy_pass http://eris_api_legacy; }
location ^~ /api/v1/telegram-user-migration/ { proxy_pass http://eris_api_legacy; }

# Ordinary traffic can move after api-next is healthy.
location /api/v1/users { proxy_pass http://eris_api_next; }
location /api/v1/admin/users { proxy_pass http://eris_api_next; }
location /health { proxy_pass http://eris_api_next; }
