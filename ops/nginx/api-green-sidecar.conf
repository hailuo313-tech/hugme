# Stage 10 blue/green sidecar. Do not replace the live hugme2.com server block until review.
# Reload-only later: copy location blocks into the existing server, then `nginx -s reload`.
# Rollback: stop api-green, keep all locations on 127.0.0.1:8000, then reload.
#
# Blue / current API → 127.0.0.1:8000 (holds Telegram sessions)
# Green candidate    → 127.0.0.1:8003 (PROCESS_ROLE=api, no Telegram)
# Host :8001 is tiktok-monitor; :8002 is api-next. Do not reuse those ports.

upstream eris_api_blue {
    server 127.0.0.1:8000;
}

upstream eris_api_green {
    server 127.0.0.1:8003;
}

# Telegram control + video stay on blue.
location ^~ /api/v1/telegram/ { proxy_pass http://eris_api_blue; }
location ^~ /api/v1/mtproto { proxy_pass http://eris_api_blue; }
location ^~ /api/v1/call-broadcast/ { proxy_pass http://eris_api_blue; }
location ^~ /api/v1/video-reinvite/ { proxy_pass http://eris_api_blue; }
location ^~ /api/v1/telegram-user-migration/ { proxy_pass http://eris_api_blue; }

# Ordinary traffic can move to green only after an operator copies these lines.
location /api/v1/users { proxy_pass http://eris_api_green; }
location /api/v1/admin/users { proxy_pass http://eris_api_green; }
location /health { proxy_pass http://eris_api_green; }
